<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="rack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#rack)"/>
  
  <!-- 19 inch Rack Rails -->
  <rect x="180" y="40" width="24" height="520" fill="#334155"/>
  <rect x="596" y="40" width="24" height="520" fill="#334155"/>
  
  <!-- Rack Unit Screws -->
  <circle cx="192" cy="120" r="4" fill="#94a3b8"/>
  <circle cx="192" cy="180" r="4" fill="#94a3b8"/>
  <circle cx="192" cy="300" r="4" fill="#94a3b8"/>
  <circle cx="608" cy="120" r="4" fill="#94a3b8"/>
  <circle cx="608" cy="180" r="4" fill="#94a3b8"/>
  <circle cx="608" cy="300" r="4" fill="#94a3b8"/>

  <!-- 24-Port Cat6 Patch Panel (1U) -->
  <rect x="204" y="90" width="392" height="50" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="215" y="118" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">PATCH PANEL 01</text>
  <!-- RJ45 Ports & Patch Cords -->
  <rect x="310" y="102" width="270" height="26" fill="#0f172a" rx="2"/>
  <path d="M 325 115 Q 325 220 370 230" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <path d="M 345 115 Q 345 225 390 230" fill="none" stroke="#22c55e" stroke-width="4"/>
  <path d="M 365 115 Q 365 220 410 230" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <path d="M 385 115 Q 385 225 430 230" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <!-- 24-Port Gigabit PoE+ Managed Switch (SW-MDF-01) -->
  <rect x="204" y="150" width="392" height="55" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="215" y="178" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">SW-MDF-01</text>
  <text x="215" y="194" fill="#71717a" font-family="monospace" font-size="9">Ruijie RG-NBS3100-24GT4SFP-P</text>
  <!-- Switch Port LEDs blinking -->
  <circle cx="330" cy="170" r="3" fill="#22c55e"/>
  <circle cx="345" cy="170" r="3" fill="#22c55e"/>
  <circle cx="360" cy="170" r="3" fill="#22c55e"/>
  <circle cx="375" cy="170" r="3" fill="#22c55e"/>

  <!-- 32-Channel NVR (DS-7732NI-I4) (2U) -->
  <rect x="204" y="215" width="392" height="110" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <rect x="220" y="235" width="80" height="24" fill="#18181b" rx="2"/>
  <text x="260" y="251" fill="#e4e4e7" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HIKVISION</text>
  <text x="220" y="280" fill="#a1a1aa" font-family="monospace" font-size="9">DS-7732NI-I4 • 4x 8TB WD PURPLE</text>
  <!-- Hard Drive Bays -->
  <rect x="360" y="235" width="50" height="70" fill="#18181b" stroke="#3f3f46" rx="2"/>
  <rect x="420" y="235" width="50" height="70" fill="#18181b" stroke="#3f3f46" rx="2"/>
  <rect x="480" y="235" width="50" height="70" fill="#18181b" stroke="#3f3f46" rx="2"/>
  <rect x="540" y="235" width="40" height="70" fill="#18181b" stroke="#3f3f46" rx="2"/>

  <!-- Status Stamp -->
  <rect x="20" y="520" width="760" height="60" fill="rgba(0,0,0,0.65)" rx="8"/>
  <text x="40" y="545" fill="#B9FF66" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">SITE AS-BUILT EVIDENCE: NVR-01 [NOC Server Rack A Unit 4]</text>
  <text x="40" y="565" fill="#94a3b8" font-family="monospace" font-size="12">FIBER UPLINK: FIB-MDF-01 • 32 CH LIVE RECORDER • TESTED BY: Wan Pidin • DATE: 2026-10-12</text>
  <rect x="680" y="533" width="80" height="30" fill="#22c55e" rx="4"/>
  <text x="720" y="553" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ONLINE</text>
</svg>