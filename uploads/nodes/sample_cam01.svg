<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Background / Ceiling -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ceiling grid lines -->
  <line x1="0" y1="180" x2="800" y2="180" stroke="#334155" stroke-width="3"/>
  <line x1="250" y1="0" x2="250" y2="600" stroke="#334155" stroke-width="2"/>
  <line x1="550" y1="0" x2="550" y2="600" stroke="#334155" stroke-width="2"/>
  
  <!-- Conduit / Cable drop -->
  <rect x="390" y="0" width="20" height="220" fill="#64748b" rx="2"/>
  <line x1="400" y1="0" x2="400" y2="220" stroke="#475569" stroke-width="2"/>
  
  <!-- Cable Tag Label -->
  <rect x="420" y="140" width="110" height="26" fill="#fef08a" stroke="#ca8a04" rx="4"/>
  <text x="475" y="157" fill="#854d0e" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">C-L2-001</text>

  <!-- Ceiling Mount Base -->
  <ellipse cx="400" cy="220" rx="90" ry="24" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Dome Housing Base -->
  <path d="M 320 220 Q 320 270 340 310 L 460 310 Q 480 270 480 220 Z" fill="#e2e8f0"/>
  <!-- Dark Trim Ring -->
  <ellipse cx="400" cy="310" rx="60" ry="16" fill="#1e293b"/>
  <!-- Tinted Glass Dome -->
  <ellipse cx="400" cy="325" rx="52" ry="40" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Camera Lens Inside -->
  <circle cx="400" cy="328" r="22" fill="url(#lens)" stroke="#0284c7" stroke-width="3"/>
  <circle cx="400" cy="328" r="8" fill="#0f172a"/>
  <!-- Lens reflection glare -->
  <ellipse cx="393" cy="322" rx="6" ry="4" fill="white" opacity="0.6" transform="rotate(-30 393 322)"/>
  
  <!-- Green Status LED -->
  <circle cx="445" cy="312" r="4" fill="#22c55e"/>
  <circle cx="445" cy="312" r="8" fill="#22c55e" opacity="0.4"/>

  <!-- Timestamp & Metadata Overlay (On-Site Verification Stamp) -->
  <rect x="20" y="520" width="760" height="60" fill="rgba(0,0,0,0.65)" rx="8"/>
  <text x="40" y="545" fill="#B9FF66" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">SITE AS-BUILT EVIDENCE: CAM-01 [Hikvision Dome]</text>
  <text x="40" y="565" fill="#94a3b8" font-family="monospace" font-size="12">LOCATION: Main Lobby Ceiling • TESTED BY: Wan Pidin • DATE: 2026-10-15 14:32 MYT</text>
  <rect x="680" y="533" width="80" height="30" fill="#22c55e" rx="4"/>
  <text x="720" y="553" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LIVE VERIFIED</text>
</svg>