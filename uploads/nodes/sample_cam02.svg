<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Brick / Concrete Wall -->
  <rect width="800" height="600" fill="url(#wall)"/>
  
  <!-- Wall Bracket & Backplate -->
  <rect x="120" y="240" width="40" height="120" fill="#64748b" rx="4"/>
  <circle cx="140" cy="260" r="5" fill="#334155"/>
  <circle cx="140" cy="340" r="5" fill="#334155"/>
  
  <!-- Arm -->
  <path d="M 160 280 L 260 280 L 280 290 L 260 300 L 160 300 Z" fill="#94a3b8"/>
  <circle cx="270" cy="290" r="16" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>

  <!-- Flexible conduit & Cable Tag -->
  <path d="M 140 360 Q 140 420 200 420 L 280 420" fill="none" stroke="#94a3b8" stroke-width="12"/>
  <rect x="190" y="405" width="100" height="24" fill="#fef08a" stroke="#ca8a04" rx="4"/>
  <text x="240" y="421" fill="#854d0e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">C-L2-002</text>

  <!-- Bullet Camera Body -->
  <!-- Sunshield -->
  <path d="M 270 240 L 520 230 L 540 250 L 290 260 Z" fill="#f1f5f9"/>
  <!-- Cylindrical Body -->
  <rect x="290" y="255" width="220" height="85" fill="#e2e8f0" rx="6"/>
  <!-- Front Lens Bezel -->
  <ellipse cx="510" cy="297" rx="20" ry="42" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <!-- IR LED Ring -->
  <circle cx="512" cy="297" r="26" fill="#1e293b"/>
  <circle cx="512" cy="280" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="512" cy="314" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="496" cy="297" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="528" cy="297" r="3" fill="#ef4444" opacity="0.8"/>
  <!-- Center Lens -->
  <circle cx="512" cy="297" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="512" cy="297" r="5" fill="#0f172a"/>

  <!-- Amber Status Tag (Mounted) -->
  <rect x="20" y="520" width="760" height="60" fill="rgba(0,0,0,0.65)" rx="8"/>
  <text x="40" y="545" fill="#B9FF66" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">SITE AS-BUILT EVIDENCE: CAM-02 [Hikvision Bullet]</text>
  <text x="40" y="565" fill="#94a3b8" font-family="monospace" font-size="12">LOCATION: East Emergency Doorway • TESTED BY: Wan Pidin • DATE: 2026-10-16 11:15 MYT</text>
  <rect x="670" y="533" width="90" height="30" fill="#f59e0b" rx="4"/>
  <text x="715" y="553" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MOUNTED</text>
