<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252836" stroke-width="0.8"/>
    </pattern>
    <style>
      .wall { stroke: #4f566b; stroke-width: 6; fill: none; stroke-linecap: square; }
      .inner-wall { stroke: #3b4254; stroke-width: 4; fill: none; }
      .door { stroke: #B9FF66; stroke-width: 2.5; stroke-dasharray: 4,4; fill: none; }
      .room-label { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; fill: #8c93a8; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
      .dim-label { font-family: 'Space Grotesk', monospace; font-size: 13px; fill: #5a627a; }
      .zone-bg { fill: #1a1c24; }
      .zone-highlight { fill: #161820; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#13141b"/>
  <rect width="1600" height="1000" fill="url(#cadGrid)"/>

  <!-- Title Block -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="1.5">HQ LEVEL 2 — OPERATIONS &amp; NOC</text>
    <text x="0" y="46" font-family="'Space Grotesk', monospace" font-size="13" fill="#B9FF66">SCALE: 1:100  |  SYSTEM: ARCH-SCHEMATIC-V2  |  GRID: 2.0m</text>
  </g>

  <!-- Outer Building Boundary -->
  <rect x="60" y="100" width="1480" height="840" class="zone-bg" rx="4"/>
  <rect x="60" y="100" width="1480" height="840" class="wall" rx="4"/>

  <!-- ================= ROOM 1: Main Lobby & Reception (Top Left) ================= -->
  <rect x="60" y="100" width="460" height="340" class="zone-highlight"/>
  <line x1="520" y1="100" x2="520" y2="440" class="inner-wall"/>
  <line x1="60" y1="440" x2="520" y2="440" class="inner-wall"/>
  <text x="290" y="260" class="room-label" text-anchor="middle">Main Lobby &amp; Reception</text>
  <text x="290" y="285" class="dim-label" text-anchor="middle">11.5m x 8.5m  (Zone A)</text>
  <!-- Main Entrance Doors -->
  <line x1="240" y1="100" x2="340" y2="100" stroke="#B9FF66" stroke-width="8"/>
  <text x="290" y="90" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#B9FF66" font-weight="700" text-anchor="middle">MAIN ENTRANCE</text>

  <!-- ================= ROOM 2: Conference Suite (Top Middle) ================= -->
  <rect x="520" y="100" width="560" height="340" fill="#181a23"/>
  <line x1="1080" y1="100" x2="1080" y2="440" class="inner-wall"/>
  <text x="800" y="260" class="room-label" text-anchor="middle">Conference Suite Alpha</text>
  <text x="800" y="285" class="dim-label" text-anchor="middle">14.0m x 8.5m  (Zone B)</text>
  <!-- Conference Table outline -->
  <rect x="660" y="200" width="280" height="90" rx="40" fill="none" stroke="#2e3446" stroke-width="2"/>

  <!-- ================= ROOM 3: Executive Suite (Top Right) ================= -->
  <rect x="1080" y="100" width="460" height="340" class="zone-highlight"/>
  <text x="1310" y="260" class="room-label" text-anchor="middle">Executive Suite</text>
  <text x="1310" y="285" class="dim-label" text-anchor="middle">11.5m x 8.5m  (Zone C)</text>

  <!-- ================= Central Corridor ================= -->
  <rect x="60" y="440" width="1480" height="120" fill="#151720"/>
  <line x1="60" y1="560" x2="1540" y2="560" class="inner-wall"/>
  <text x="800" y="508" class="room-label" text-anchor="middle" fill="#525970">Central Corridor — North / South Access</text>

  <!-- Corridor Access Doors (door swing arcs) -->
  <path d="M 270 440 A 50 50 0 0 1 320 390" class="door"/>
  <path d="M 780 440 A 50 50 0 0 1 830 390" class="door"/>
  <path d="M 1290 440 A 50 50 0 0 1 1340 390" class="door"/>

  <!-- ================= ROOM 4: Server Room / NOC (Bottom Left) ================= -->
  <rect x="60" y="560" width="400" height="380" fill="#171922"/>
  <line x1="460" y1="560" x2="460" y2="940" class="inner-wall"/>
  <text x="260" y="730" class="room-label" text-anchor="middle" fill="#B9FF66">Server Room / NOC</text>
  <text x="260" y="755" class="dim-label" text-anchor="middle">10.0m x 9.5m  [RESTRICTED]</text>
  <!-- Server Rack symbols -->
  <g fill="#252a3a" stroke="#3b4254" stroke-width="1.5">
    <rect x="120" y="620" width="60" height="160" rx="3"/>
    <rect x="200" y="620" width="60" height="160" rx="3"/>
    <rect x="280" y="620" width="60" height="160" rx="3"/>
  </g>
  <path d="M 230 560 A 50 50 0 0 0 280 610" class="door"/>

  <!-- ================= ROOM 5: Open Collaboration Space (Bottom Middle) ================= -->
  <rect x="460" y="560" width="680" height="380" fill="#181a24"/>
  <line x1="1140" y1="560" x2="1140" y2="940" class="inner-wall"/>
  <text x="800" y="730" class="room-label" text-anchor="middle">Open Collaboration Space</text>
  <text x="800" y="755" class="dim-label" text-anchor="middle">17.0m x 9.5m  (Zone D)</text>
  <!-- Desks pods -->
  <g stroke="#2c3244" stroke-width="1.5" fill="none">
    <rect x="540" y="620" width="160" height="80" rx="4"/>
    <rect x="760" y="620" width="160" height="80" rx="4"/>
    <rect x="540" y="780" width="160" height="80" rx="4"/>
    <rect x="760" y="780" width="160" height="80" rx="4"/>
  </g>

  <!-- ================= ROOM 6: Utility, Storage & Telecom (Bottom Right) ================= -->
  <rect x="1140" y="560" width="400" height="380" class="zone-highlight"/>
  <text x="1340" y="730" class="room-label" text-anchor="middle">MDF / Telecom Utility</text>
  <text x="1340" y="755" class="dim-label" text-anchor="middle">10.0m x 9.5m  (Zone E)</text>
  <path d="M 1310 560 A 50 50 0 0 0 1360 610" class="door"/>

  <!-- Emergency Exit on East Wall -->
  <line x1="1540" y1="480" x2="1540" y2="520" stroke="#FF6B6B" stroke-width="8"/>
  <text x="1530" y="470" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#FF6B6B" font-weight="700" text-anchor="end">EMERGENCY EXIT</text>
</svg>

